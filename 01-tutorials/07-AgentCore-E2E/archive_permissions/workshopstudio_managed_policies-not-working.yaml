AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Comprehensive deployment creating a SageMaker Studio Domain with all required AgentCore workshop infrastructure including DynamoDB tables, Lambda functions, Cognito resources, and IAM roles. Uses managed policies for improved size management.

Parameters:
  UserProfileName:
    Type: String
    Description: The user profile name for the SageMaker workshop
    Default: 'agentcoreuser'
  DomainName:
    Type: String
    Description: The domain name of the Sagemaker studio instance
    Default: 'agentcore-workshop'
  SpaceName:
    Type: String
    Description: The space name of the Sagemaker studio JupyterLab instance
    Default: 'agentcore-workshop-space'
  UserPoolName:
    Type: String
    Default: 'CustomerSupportGatewayPool'
    Description: 'Name of the Cognito User Pool'
  MachineAppClientName:
    Type: String
    Default: 'CustomerSupportMachineClient'
    Description: 'Name of the Cognito User Pool Application Client'
  WebAppClientName:
    Type: String
    Default: 'CustomerSupportWebClient'
    Description: 'Name of the Cognito User Pool Web Application Client'
  LambdaS3Bucket:
    Description: The name of S3 bucket which contains lambda code
    Type: String
    Default: 'ws-assets-prod-iad-r-pdx-f3b3f9f1a7d6a3d0'
  LambdaS3Key:
    Description: The S3 object key which contains customer support assistant code in zip format
    Type: String
    Default: '850fcd5c-fd1f-48d7-932c-ad9babede979/lambda.zip'
  LayerS3Key:
    Type: String
    Description: 'S3 key for the DDGS layer zip file'
    Default: '850fcd5c-fd1f-48d7-932c-ad9babede979/ddgs-layer.zip'

Mappings: 
  RegionMap:
    us-east-1: 
      jupyter: "arn:aws:sagemaker:us-east-1:081325390199:image/jupyter-server-3"
      instance: "ml.m5.2xlarge"
    us-west-2: 
      jupyter: "arn:aws:sagemaker:us-west-2:236514542706:image/jupyter-server-3"
      instance: "ml.m5.2xlarge"

Resources:

  # New managed policies to reduce IAM policy size

  AgentCoreObservabilityPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Comprehensive permissions for AgentCore observability including CloudWatch, X-Ray, and Application Signals
      Path: /
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - application-signals:StartDiscovery
              - application-signals:BatchGetServiceLevelObjectiveBudgetReport
              - application-signals:GetService
              - application-signals:GetServiceLevelObjective
              - application-signals:ListServiceLevelObjectives
              - application-signals:ListServices
              - application-signals:ListServiceDependencies
              - application-signals:ListServiceDependents
              - application-signals:ListServiceOperations
              - application-signals:EnableTransactionSearch
              - application-signals:ListObservedEntities
              - logs:PutLogEvents
              - logs:FilterLogEvents                  
              - logs:DescribeLogGroups
              - logs:PutDestination
              - logs:GetLogEvents
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutResourcePolicy
              - logs:PutRetentionPolicy
              - logs:DescribeLogStreams
              - logs:DeleteLogGroup
              - logs:DeleteLogStream
              - logs:StartQuery
              - logs:StopQuery
              - logs:GetQueryResults
              - logs:GetLogRecord
              - logs:TestMetricFilter
              - logs:PutMetricFilter
              - logs:PutDeliverySource
              - logs:PutDeliveryDestination
              - logs:CreateDelivery
              - logs:PutDeliveryDestinationPolicy
              - logs:GetDeliverySource
              - logs:GetDeliveryDestination
              - logs:GetDelivery
              - logs:ListDeliveries
              - logs:DeleteDelivery
              - logs:AssociateKmsKey
              - logs:DisassociateKmsKey
              - logs:TagLogGroup
              - logs:UntagLogGroup
              - logs:ListTagsLogGroup
              - xray:GetSamplingRules
              - xray:GetSamplingTargets
              - xray:GetSamplingStatisticSummaries
              - xray:PutTelemetryRecords
              - xray:PutTraceSegments
              - xray:UpdateTraceSegmentDestination
              - xray:GetTraceSegmentDestination
              - xray:UpdateIndexingRule
              - xray:GetIndexingRule
              - xray:GetTraceGraph
              - xray:GetTraceSummaries
              - xray:BatchGetTraces
              - xray:GetServiceGraph
              - xray:GetTimeSeriesServiceStatistics
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
              - cloudwatch:GetDashboard
              - cloudwatch:ListDashboards
              - cloudwatch:PutMetricData
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DescribeAlarms
              - cloudwatch:CreateDashboard
              - cloudwatch:PutDashboard
              - cloudwatch:DeleteDashboard
            Resource: "*"

  CloudTrailAuditPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permissions for CloudTrail audit logging and management
      Path: /
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - cloudtrail:LookupEvents
              - cloudtrail:GetEventSelectors
              - cloudtrail:DescribeTrails
              - cloudtrail:GetTrailStatus
            Resource: "*"
          - Effect: Allow
            Action:
              - cloudtrail:CreateTrail
              - cloudtrail:UpdateTrail
              - cloudtrail:StartLogging
              - cloudtrail:StopLogging
              - cloudtrail:PutEventSelectors
              - cloudtrail:PutInsightSelectors
              - cloudtrail:GetInsightSelectors
            Resource: "arn:aws:cloudtrail:*:*:trail/*"
          - Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:PutBucketPolicy
              - s3:GetBucketPolicy
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketPublicAccessBlock
              - s3:PutObject
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - "arn:aws:s3:::cloudtrail-*"
              - "arn:aws:s3:::cloudtrail-*/*"
              - "arn:aws:s3:::aws-cloudtrail-*"
              - "arn:aws:s3:::aws-cloudtrail-*/*"
          - Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:Subscribe
              - sns:Publish
            Resource: "arn:aws:sns:*:*:cloudtrail-*"
          - Effect: Allow
            Action:
              - kms:CreateKey
              - kms:CreateAlias
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:PutKeyPolicy
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource:
              - "arn:aws:kms:*:*:key/*"
              - "arn:aws:kms:*:*:alias/cloudtrail-*"
          - Effect: Allow
            Action:
              - tag:GetResources
              - tag:TagResources
              - tag:UntagResources
              - tag:GetTagKeys
              - tag:GetTagValues
            Resource: "*"

  AgentCoreServicesPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permissions for AgentCore runtime, gateway, memory, and dashboard functionality
      Path: /
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          # Runtime access
          - Effect: Allow
            Action:
              - bedrock-agentcore:CreateAgentRuntime
              - bedrock-agentcore:UpdateAgentRuntime
              - bedrock-agentcore:GetAgentRuntime
              - bedrock-agentcore:ListAgentRuntimes
              - bedrock-agentcore:CreateAgentRuntimeEndpoint
              - bedrock-agentcore:UpdateAgentRuntimeEndpoint
              - bedrock-agentcore:GetAgentRuntimeEndpoint
              - bedrock-agentcore:ListAgentRuntimeEndpoints
              - bedrock-agentcore:ListAgentRuntimeVersions
              - bedrock-agentcore:CreateWorkloadIdentity
              - bedrock-agentcore:UploadWorkloadIdentity
              - bedrock-agentcore:GetWorkloadIdentity
              - bedrock-agentcore:ListWorkloadIdentities
              - bedrock-agentcore:InvokeAgentRuntime
              - bedrock-agentcore:DeleteAgentRuntime
              - bedrock-agentcore:DeleteAgentRuntimeEndpoint
            Resource: "*"
          # Gateway access
          - Effect: Allow
            Action:
              - bedrock-agentcore:CreateGateway
              - bedrock-agentcore:UpdateGateway
              - bedrock-agentcore:DeleteGateway
              - bedrock-agentcore:GetGateway
              - bedrock-agentcore:ListGateways
              - bedrock-agentcore:CreateGatewayTarget
              - bedrock-agentcore:UpdateGatewayTarget
              - bedrock-agentcore:DeleteGatewayTarget
              - bedrock-agentcore:GetGatewayTarget
              - bedrock-agentcore:ListGatewayTargets
              - bedrock-agentcore:DeleteWorkloadIdentity
              - bedrock-agentcore:CreateApiKeyCredentialProvider
              - bedrock-agentcore:CreateTokenVault
              - bedrock-agentcore:SynchronizeGatewayTargets
              - bedrock-agentcore:GetGateway
              - bedrock-agentcore:*
            Resource: "*"
          # Memory access
          - Effect: Allow
            Action:
              - bedrock-agentcore:CreateMemory
              - bedrock-agentcore:GetMemory
              - bedrock-agentcore:ListMemories
              - bedrock-agentcore:ListEvents
              - bedrock-agentcore:CreateEvent
              - bedrock-agentcore:DeleteMemory
            Resource: "*"
          # Dashboard access
          - Effect: Allow
            Action:
              - bedrock-agentcore:ListAgents
              - bedrock-agentcore:GetAgent
              - bedrock-agentcore:ListSessions
              - bedrock-agentcore:GetSession
              - bedrock-agentcore:ListTraces
              - bedrock-agentcore:GetTrace
              - bedrock-agentcore:PutLogEvents
            Resource: "*"
          # Memory logs access
          - Effect: Allow
            Action:
              - bedrock-agentcore:PutLogEvents
              - bedrock-agentcore:AllowVendedLogDeliveryForResource
            Resource: "arn:aws:bedrock-agentcore:*:*:memory/*"
          # Gateway logs access
          - Effect: Allow
            Action:
              - bedrock-agentcore:PutLogEvents
              - bedrock-agentcore:AllowVendedLogDeliveryForResource
            Resource: "arn:aws:bedrock-agentcore:*:*:gateway/*"
          # Identity access
          - Effect: Allow
            Action:
              - bedrock-agentcore:CreateApiKeyCredentialProvider
              - bedrock-agentcore:DeleteApiKeyCredentialProvider
              - bedrock-agentcore:GetApiKeyCredentialProvider
              - bedrock-agentcore:ListApiKeyCredentialProviders
              - bedrock-agentcore:UpdateApiKeyCredentialProvider
              - bedrock-agentcore:CreateOAuth2CredentialProvider
              - bedrock-agentcore:DeleteOAuth2CredentialProvider
              - bedrock-agentcore:GetOAuth2CredentialProvider
              - bedrock-agentcore:ListOAuth2CredentialProviders
              - bedrock-agentcore:UpdateOAuth2CredentialProvider
              - bedrock-agentcore:CreateTokenVault
              - bedrock-agentcore:GetTokenVault
              - bedrock-agentcore:SetTokenVaultCmk
              - bedrock-agentcore:GetResourceApiKey
            Resource: "*"

  LambdaExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      Path: /
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies: 
        - PolicyName: s3-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:ListMultipartUploadParts
                  - s3:AbortMultipartUpload
                Resource: arn:aws:s3:::*
        - PolicyName: iam-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                Resource: '*'
        - PolicyName: ec2-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                Resource: '*'

  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: 
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: 
              Service: 
                - sagemaker.amazonaws.com
            Action: 
              - sts:AssumeRole
          - Effect: Allow
            Principal: 
              Service: 
                - bedrock.amazonaws.com
            Action: 
              - sts:AssumeRole
          - Effect: Allow
            Principal: 
              Service: 
                - bedrock-agentcore.amazonaws.com
            Action: 
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub "${AWS::AccountId}"
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:bedrock-agentcore:*:${AWS::AccountId}:*"
      Path: /
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonSageMakerReadOnly"
        - "arn:aws:iam::aws:policy/AWSCloudFormationReadOnlyAccess"
        - "arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess"
        - "arn:aws:iam::aws:policy/AmazonBedrockReadOnly"
        - "arn:aws:iam::aws:policy/AmazonQDeveloperAccess"
        - !Ref AgentCoreObservabilityPolicy
        - !Ref CloudTrailAuditPolicy
        - !Ref AgentCoreServicesPolicy
      Policies: 
        - PolicyName: sm-studio-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:UpdateSpace
                  - sagemaker:DeleteSpace
                  - sagemaker:DeleteApp
                  - sagemaker:CreatePresignedNotebookInstanceUrl
                  - sagemaker:UpdateAppImageConfig
                  - sagemaker:CreateSpace
                  - sagemaker:CreateStudioLifecycleConfig
                  - sagemaker:DeleteStudioLifecycleConfig
                  - sagemaker:CreatePresignedDomainUrl
                  - sagemaker:DeleteAppImageConfig
                  - sagemaker:CreateApp
                  - sagemaker:AddTags
                Resource: arn:aws:sagemaker:*:*:*
        - PolicyName: s3-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:DeleteBucket
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketVersioning
                  - s3:PutBucketPublicAccessBlock
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPolicy
                Resource: arn:aws:s3:::*
        - PolicyName: s3-create-bucket-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                Resource:
                  - arn:aws:s3:::*
        - PolicyName: iam-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PutRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:CreatePolicy
                  - iam:AttachRolePolicy
                  - iam:CreateServiceLinkedRole
                  - iam:DeleteRole
                  - iam:DeletePolicy
                  - iam:PassRole
                  - iam:GetPolicy
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:ListRolePolicies
                Resource: '*'
        - PolicyName: bedrock-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:TagResource
                  - bedrock:UntagResource
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:StartIngestionJob
                  - bedrock:Retrieve
                Resource: "arn:aws:bedrock:*:*:*"
        - PolicyName: bedrock-deny
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Deny
                Action:
                  - bedrock:CreateModelCustomizationJob
                  - bedrock:StopModelCustomizationJob
                  - bedrock:GetModelCustomizationJob
                  - bedrock:ListModelCustomizationJobs
                Resource: "*"
        - PolicyName: lambda-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:InvokeFunction
                  - lambda:CreateEventSourceMapping
                  - lambda:GetEventSourceMapping
                Resource: "*"
        - PolicyName: dynamodb-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:ListTables
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource: "arn:aws:dynamodb:*:*:table/*"
        - PolicyName: cfn-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:ListStacks
                  - cloudformation:UpdateStack
                  - cloudformation:CreateStack
                Resource: "arn:aws:cloudformation:*:*:stack/*"
        - PolicyName: ssm-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:PutParameter                  
                  - ssm:GetParameters
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                  - "sns:*"
                Resource: "*"
        - PolicyName: ecr-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ecr:PutLifecyclePolicy
                  - ecr:SetRepositoryPolicy
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DeleteRepository
                  - ecr:CreateRepository
                Resource: "arn:aws:ecr:*:*:repository/*"
        - PolicyName: sns-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "sns:*"
                Resource: "*"
        - PolicyName: codebuild-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:CreateProject
                  - codebuild:StartBuild
                  - codebuild:UpdateProject
                  - codebuild:BatchGetBuilds
                Resource: "*"
        - PolicyName: cognito-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeResourceServer
                  - cognito-idp:CreateResourceServer
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:CreateUserPool
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:CreateUserPoolDomain
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:ListUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                Resource: "*"
        - PolicyName: secret-manager
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DeleteSecret
                Resource: "*"
        - PolicyName: secretsmanager-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DeleteSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource: "*"

  DefaultVpcLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CFGetDefaultVpcId
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse

          ec2 = boto3.client('ec2')

          def lambda_handler(event, context):              
              if 'RequestType' in event and event['RequestType'] == 'Create':
                  vpc_id = get_default_vpc_id()
                  subnets = get_subnets_for_vpc(vpc_id)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'VpcId': vpc_id, 'Subnets': subnets}, '')
              else:
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, '')

          def get_default_vpc_id():
              vpcs = ec2.describe_vpcs(Filters=[{'Name': 'is-default', 'Values': ['true']}])
              vpc_id = vpcs['Vpcs'][0]['VpcId']
              return vpc_id

          def get_subnets_for_vpc(vpcId):
              response = ec2.describe_subnets(Filters=[{'Name': 'vpc-id', 'Values': [vpcId]}])
              subnet_ids = [subnet['SubnetId'] for subnet in response['Subnets']]
              return subnet_ids 
      Description: Return default VPC ID and Subnets
      Handler: index.lambda_handler
      MemorySize: 512
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.9
      Timeout: 5

  DefaultVpcFinder:
    Type: Custom::ResourceForFindingDefaultVpc
    Properties:
      ServiceToken: !GetAtt DefaultVpcLambda.Arn
      ServiceTimeout: 5

  StudioDomain:
    Type: AWS::SageMaker::Domain
    Properties: 
      AppNetworkAccessType: PublicInternetOnly
      AuthMode: IAM
      DefaultUserSettings: 
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
        StudioWebPortal: ENABLED
        StudioWebPortalSettings:
          HiddenAppTypes:
            - Canvas
            - JupyterServer # Studio Classic
            - RStudioServerPro
            - TensorBoard
            - DetailedProfiler
          HiddenMlTools:
            - FeatureStore
            - EmrClusters
      DomainName: !Ref DomainName
      SubnetIds: !GetAtt DefaultVpcFinder.Subnets
      VpcId: !GetAtt DefaultVpcFinder.VpcId
      DefaultSpaceSettings: 
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
      DomainSettings:
        DockerSettings:
          EnableDockerAccess: ENABLED
      Tags:
        - Key: 'env'
          Value: 'aws-agentcore-workshop'
        - Key: 'version'
          Value: '1.0'

  UserProfile:
    Type: AWS::SageMaker::UserProfile
    Properties: 
      DomainId: !GetAtt StudioDomain.DomainId
      UserProfileName: !Ref UserProfileName
      UserSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
      Tags:
        - Key: 'env'
          Value: 'aws-agentcore-workshop'
        - Key: 'version'
          Value: '1.0'
        - Key: 'user'
          Value: !Ref UserProfileName

  JupyterLabSpace:
    Type: AWS::SageMaker::Space
    DependsOn:
      - UserProfile
    Properties:
      DomainId: !GetAtt StudioDomain.DomainId
      SpaceName: !Ref SpaceName
      SpaceSettings:
        AppType: JupyterLab
        SpaceStorageSettings:
          EbsStorageSettings: 
             EbsVolumeSizeInGb: 100
        JupyterLabAppSettings:
          DefaultResourceSpec: 
            InstanceType: !FindInMap
              - RegionMap
              - !Ref "AWS::Region"
              - instance
      SpaceSharingSettings:
        SharingType: Private
      OwnershipSettings:
        OwnerUserProfileName: !Ref UserProfileName

  ####################################################################################################################
  #### Workshop Infrastructure Resources
  ####################################################################################################################

  # AgentCore Runtime IAM Role
  RuntimeAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock-agentcore.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ECRImageAccess
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/bedrock_agentcore-customersupport*
              - Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:CreateLogGroup
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
              - Sid: ECRTokenAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: GetAgentAccessToken
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/customersupport*
              - Sid: ProvisionedThroughputModelInvocation
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*
              - Sid: SSMGetparam
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/customersupport/*
              - Sid: Identity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetResourceOauth2Token
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/oauth2credentialprovider/customersupport*
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/customersupport*
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default
              - Sid: SecretManager
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!default/oauth2/customersupport*
              - Sid: AgentCoreMemory
                Effect: Allow
                Action:
                  - bedrock-agentcore:ListMemories
                  - bedrock-agentcore:ListMemoryRecords
                  - bedrock-agentcore:RetrieveMemoryRecords
                  - bedrock-agentcore:GetMemory
                  - bedrock-agentcore:GetMemoryRecord
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:GetEvent
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/customersupport*

  # AgentCore Gateway IAM Role
  GatewayAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock-agentcore.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeFunction
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt CustomerSupportLambda.Arn

  # Rest of the CloudFormation template follows, preserving all the other resources from the original template
  # DynamoDB Tables, Lambda functions, Cognito, etc.
  
  # Include all remaining resources from original template here...

  # DynamoDB Table for Warranty Information
  WarrantyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serial_number
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: serial_number
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: customer-index
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: CustomerSupport
        - Key: CostCenter
          Value: CustomerSupport

  # DynamoDB Table for Customer Profiles
  CustomerProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: phone-index
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: CustomerSupport
        - Key: CostCenter
          Value: CustomerSupport

